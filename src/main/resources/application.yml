server:
  port: ${SERVER_PORT:8080}

# C1:Actuator 提供 MeterRegistry bean(AI 观测 advisor 需要);仅暴露 health(不对外暴露指标/环境等敏感端点)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: sparkora
  datasource:
    url: jdbc:postgresql://${SPARKORA_DB_HOST:localhost}:${SPARKORA_DB_PORT:5432}/${SPARKORA_DB_NAME:sparkora}
    username: ${SPARKORA_DB_USER:sparkora}
    password: ${SPARKORA_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      # S3b:配图上传放开 Spring 默认 1MB 限制(对齐 IMAGE_MAX_UPLOAD_MB,略放宽头开销)
      max-file-size: ${IMAGE_MAX_UPLOAD_MB:10}MB
      # 09-26 img2img-multi-ref:图生图多参考图(≤4 张)请求体上限,须 >= 4×单张 + 表单开销
      max-request-size: ${IMAGE_MAX_REQUEST_MB:45}MB
  # Flyway 版本化迁移(替代原 schema.sql 兼职建表;详见 docs/deploy.md 与 .trellis/spec/backend/database-guidelines.md)
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 既有库(非空 schema 且无 flyway_schema_history)标记基线 V1 已应用后跳过历史 DDL/回填,不重跑
    baseline-on-migrate: true
    # 基线对齐 V1:既有库记为 BSLN@1(V1 不执行);空库无历史表,正常执行 V1 全量
    baseline-version: 1
    baseline-description: "schema.sql baseline (S0~S12 全量)"
    # 校验已应用脚本 checksum,防止迁移文件被事后篡改
    validate-on-migrate: true
    # 09-27:V3 迁移回填存量向量行的 embedding_model = 实际部署配置模型(避免硬编码默认值错标既有库)
    placeholders:
      embeddingModel: ${AI_EMBEDDING_MODEL:Qwen3-Embedding-8B}
  jackson:
    default-property-inclusion: non_null
  # Boot 4 默认 Jackson 3,spring.jackson.* 现仅作用于 MVC 的 Jackson 3 序列化;
  # 业务层注入的 Jackson 2 ObjectMapper(spring-boot-jackson2 兼容模块提供)读 spring.jackson2.*。
  # 镜像同值以保持内部 JSON 拼装(JSON 列/快照)与 Boot 3.3 行为等价。
  jackson2:
    default-property-inclusion: non_null
  # Spring AI 2.0(C0 引入基座):复用既有 AI_* 环境变量,不新增密钥变量;
  # 自定义业务配置仍走 sparkora.ai.*(AiProperties),两者前缀不冲突,C1 起逐步切换调用点。
  ai:
    openai:
      # Spring AI 的 OpenAI SDK 只在 base-url 后追加 chat/completions（不带 /v1），
      # 故此处须补 /v1 以命中网关的 /v1/chat/completions（C1 实测：不补则返回网关 HTML）。
      # AI_BASE_URL 约定为网关根地址（不含 /v1）；可用 SPRING_AI_OPENAI_BASE_URL 整体覆盖。
      base-url: ${SPRING_AI_OPENAI_BASE_URL:${AI_BASE_URL:https://axo.caiqz.cn}/v1}
      api-key: ${AI_API_KEY:}
      # C1 行为等价:旧手写 RestClient 的读超时消费 AI_TIMEOUT_MS(默认 120s)、且不自动重试。
      # Spring AI 默认 60s + 3 次重试,会用 60s 掐断长 reasoning/长正文生成并放大失败代价;
      # 此处按 Spring AI 的 OpenAI 客户端实际取参处(common 层 spring.ai.openai.*)接回
      # AI_TIMEOUT_MS 并关闭自动重试(重试语义仍由上层「截断/非法 JSON 提额重试一次」承担)。
      timeout: ${AI_TIMEOUT_MS:120000}ms
      max-retries: 0
      chat:
        options:
          model: ${AI_MODEL:}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:}
      # C6:文生图改走 Spring AI ImageModel。实际模型仍由 per-call OpenAiImageOptions
      # 按 AiProperties.imageModelList() 覆盖,此处仅供自动配置兜底(可留空)。
      image:
        options:
          model: ${AI_IMAGE_MODEL:}
    # 10-03 E1:PgVectorStore 单表(vector_store)。建表由 Flyway V5 管理(initialize-schema=false,
    # 不用 Spring 自动建表);维度 1024 与 DDL vector(1024) 一致;distance COSINE/index HNSW 对齐旧表。
    vectorstore:
      type: pgvector
      pgvector:
        table-name: vector_store
        schema-name: public
        dimensions: ${AI_EMBEDDING_DIM:1024}
        initialize-schema: false
        schema-validation: false
        id-type: uuid
        distance-type: cosine-distance
        index-type: hnsw
        remove-existing-vector-store-table: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-prefix: sparkora_
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# ===== Sparkora 业务配置 =====
sparkora:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string}
    expire-minutes: ${JWT_EXPIRE_MINUTES:1440}
  ai:
    base-url: ${AI_BASE_URL:https://axo.caiqz.cn}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    embedding-model: ${AI_EMBEDDING_MODEL:}   # S6:向量化模型(车型知识库 RAG,实测 Qwen3-Embedding-8B)
    embedding-dim: ${AI_EMBEDDING_DIM:1024}   # 09-27:向量维度校验(embedList 返回长度不符即抛 AiException)
    image-model: ${AI_IMAGE_MODEL:}
    image-models: ${AI_IMAGE_MODELS:}   # 逗号分隔，按序轮询（图片模型不稳定）
    timeout-ms: ${AI_TIMEOUT_MS:120000}
    temperature: ${AI_TEMPERATURE:0.7}
    # C1 任务级温度:结构化抽取低温(求稳定 JSON)/正文创作高温(求表达)/问答中温
    temperature-structured: ${AI_TEMPERATURE_STRUCTURED:0.2}
    temperature-prose: ${AI_TEMPERATURE_PROSE:0.7}
    temperature-qa: ${AI_TEMPERATURE_QA:0.5}
    rag-min-score: ${AI_RAG_MIN_SCORE:0.3}      # S6.1:逐块相似度门槛(低于不注入)
    rag-reject-score: ${AI_RAG_REJECT_SCORE:0.5} # S6.1:整体置信度门槛(最高分低于则全部抛弃)
    rag-kb-topk: ${AI_RAG_KB_TOPK:4}            # S7:通用知识库生成检索注入块数上限(与车型域配额独立)
    rag-kb-enabled: ${AI_RAG_KB_ENABLED:true}   # S7:通用知识库总开关(false 回退 S6.2 纯车型域)
    rag-anchor-boost: ${AI_RAG_ANCHOR_BOOST:1.15} # S8:锚点车型块分数加权系数(统一检索重排)
    rag-news-topk: ${AI_RAG_NEWS_TOPK:4}        # C2:官方新闻域生成检索注入块数上限(与车型/KB 配额独立;0=关闭 NEWS 注入)
    rag-source-topk: ${AI_RAG_SOURCE_TOPK:0}    # 10-05 E:NEWS 域内用户采集源(sourceType=user-source)独立配额;默认 0=关闭(零回归)
    rag-rerank-enabled: ${AI_RAG_RERANK_ENABLED:false} # A:LLM 重排总开关(false 默认,行为与现状逐条一致)
    rag-rerank-topn: ${AI_RAG_RERANK_TOPN:20}  # A:参与重排的候选数上限(按原分取前 N,控制 token)
    rag-rerank-timeout-ms: ${AI_RAG_RERANK_TIMEOUT_MS:10000} # A:重排单次超时预算(ms,超时回退原序)
    image-min-score: ${AI_IMAGE_MIN_SCORE:0.3}  # 09-15:图片语义检索相似度门槛(低于该余弦相似度的图片命中被过滤)
    illustration-max-anchors: ${AI_ILLUSTRATION_MAX_ANCHORS:5} # 09-15 子C:配图建议锚点上限(取前 N 个可配图段落,避免配图过密)
    illustration-top-n: ${AI_ILLUSTRATION_TOP_N:3}             # 09-15 子C:配图建议每锚点候选图条数
    illustration-suggest-enabled: ${AI_ILLUSTRATION_SUGGEST_ENABLED:true} # 09-15 子C:配图建议生成总开关(R6 可关闭;关闭的只是「建议生成」,与「禁止自动写入」无关)
  deep:                                  # S9 深度生成模式
    search-web-enabled: ${SEARCH_WEB_ENABLED:true}   # 研究子代理外部搜索总开关
    tavily-api-key: ${TAVILY_API_KEY:}  # Tavily 官方密钥(.env 用户自备;DEEP_TAVILY_API_KEY 可覆盖)
    # 10-05-tavily-endpoint-priority:Tavily 官方端点(裸名可覆盖;中转端点改用下方 tavily-relay-* 项)
    tavily-api-base: ${TAVILY_API_BASE_URL:https://api.tavily.com}
    # 双端点:中转优先、官方兜底(relay 未配置则直接走官方,零回归);两者 name() 均为 TAVILY
    tavily-relay-api-base: ${DEEP_TAVILY_API_BASE_URL:}          # 空=未配置中转
    tavily-relay-api-key: ${DEEP_TAVILY_API_KEY_HIKARI:}
    tavily-relay-read-timeout-ms: ${DEEP_TAVILY_RELAY_READ_TIMEOUT_MS:8000}       # 短超时快速失败切官方
    tavily-official-read-timeout-ms: ${DEEP_TAVILY_OFFICIAL_READ_TIMEOUT_MS:30000} # 官方稳定但可能慢
    tavily-extract-read-timeout-ms: ${DEEP_TAVILY_EXTRACT_READ_TIMEOUT_MS:15000}  # extract 独立超时,不被官方 30s 牵连
    tavily-deny-domains: ${DEEP_TAVILY_DENY_DOMAINS:weixin.sogou.com}             # 端点级质量门噪声域
    tavily-min-content-chars: ${DEEP_TAVILY_MIN_CONTENT_CHARS:0}                  # 结果级长度门槛(0=off,零回归)
    # 10-04-serper-provider A:Serper provider(Header X-API-KEY 认证;DEEP_SERPER_API_KEY 优先于 SERPER_API_KEY)
    serper-api-key: ${SERPER_API_KEY:}
    # Serper 端点可配置(默认官方;中转为 https://search.604020.xyz/serper——路径前缀必须保留)
    serper-api-base: ${DEEP_SERPER_API_BASE_URL:https://google.serper.dev}
    serper-gl: ${DEEP_SERPER_GL:cn}      # 地域;空则不下发该键
    serper-hl: ${DEEP_SERPER_HL:zh-cn}   # 语言;空则不下发该键
    # 时效题是否走 Serper /news 垂直(默认开;关闭时全部走 /search,零回归开关)
    web-vertical-news-enabled: ${DEEP_WEB_VERTICAL_NEWS:true}
    research-timeout-ms: ${DEEP_RESEARCH_TIMEOUT_MS:120000}    # 单子代理超时
    max-agents: ${DEEP_MAX_AGENTS:6}                            # 子代理数上限(R5 默认 6;计划问题数超过时截断)
    # 外部搜索 provider 顺序(部署级默认;运行时由 ADMIN 在系统设置覆盖)
    # TAVILY,SEARXNG=TAVILY_FIRST(默认,2026-09-25 反转);SEARXNG,TAVILY=SEARXNG_FIRST
    web-provider-order: ${DEEP_WEB_PROVIDER_ORDER:TAVILY,SEARXNG}
    # 10-04 B:搜索策略(first_hit 默认单源短路;primary_fanout 多源并行聚合)+ primary 组 + SearXNG 质量门。
    # 运行时 sparkora_setting 不放开 fanout 开关(直接决定成本)。
    web-fanout: ${DEEP_WEB_FANOUT:first_hit}
    web-primary-providers: ${DEEP_WEB_PRIMARY_PROVIDERS:TAVILY,SERPER,SEARXNG}
    web-deny-domains: ${DEEP_WEB_DENY_DOMAINS:bilibili.com,weixin.sogou.com}
    web-allow-domains: ${DEEP_WEB_ALLOW_DOMAINS:}
    # 09-27 背景题 WEB 正文补抓单条上限(字符):Tavily /extract 取正文后工具层截断的唯一上限
    web-content-max-chars: ${DEEP_WEB_CONTENT_MAX_CHARS:2000}
    # 10-04 C:覆盖驱动多轮补检索 + 调用预算治理(默认关/保守档,零回归)。
    # 运行时 sparkora_setting 不放开 followup/budget(直接决定成本)。
    web-followup-max: ${DEEP_WEB_FOLLOWUP_MAX:0}                    # Round 2 目标数上限;0=关闭多轮
    web-call-budget: ${DEEP_WEB_CALL_BUDGET:20}                     # 整个简报计量源调用总量上限(Round1+Round2)
    web-call-budget-per-round: ${DEEP_WEB_CALL_BUDGET_PER_ROUND:12} # Round 1 计量源封顶(生效含保护性下限)
    followup-timeout-ms: ${DEEP_FOLLOWUP_TIMEOUT_MS:30000}          # Round 2 单目标独立超时
    web-cache-ttl-ms: ${DEEP_WEB_CACHE_TTL_MS:600000}               # 批次内搜索缓存 TTL(ms)
  wechat:
    enabled: ${WECHAT_MP_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  wenyan:
    # S4 方案 A:预览用本机 CLI render(与 server 同核),发布(S5)走远程 server;
    # 发布通道是否可用只看 server-url+server-api-key(旧 WENYAN_MCP_ENABLED 开关已废弃移除)
    server-url: ${WENYAN_MCP_SERVER_URL:}
    server-api-key: ${WENYAN_MCP_SERVER_API_KEY:}
    # S4 方案 A:预览用本机 CLI render(与 server 同核),发布(S5)走远程 server
    cli-path: ${WENYAN_CLI_PATH:wenyan}
    default-theme: ${WENYAN_DEFAULT_THEME:default}
    # 已废弃(09-11-wenyan-themes):主题清单改由 WenyanThemeCatalog 权威目录固定,本项不再参与校验/下发
    theme-names: ${WENYAN_THEME_NAMES:default,lapis,orangeheart,phycat}
    highlight: ${WENYAN_HIGHLIGHT:solarized-light}
    mac-style: ${WENYAN_MAC_STYLE:true}
    footnote: ${WENYAN_FOOTNOTE:true}
    render-timeout-ms: ${WENYAN_RENDER_TIMEOUT_MS:30000}
    # S5 发布:远程 server HTTP 调用读超时。09-27 实测带 7 图(17MB)的 /publish 实耗 ~43s,
    # 原 30s 会「客户端超时但服务端已写入草稿」→ 前端报失败、草稿箱已有文章,重试即重复草稿。
    # 兜底默认同步为 180s,避免漏配环境变量时退回 30s 重现事故。
    publish-timeout-ms: ${WENYAN_MCP_PUBLISH_TIMEOUT_MS:180000}
    # 探针(/verify、/health)读超时,必须独立于发布超时:否则通道不可用时发布页被挂住同值时长
    verify-timeout-ms: ${WENYAN_MCP_VERIFY_TIMEOUT_MS:5000}
  image:
    storage-dir: ${IMAGE_STORAGE_DIR:./data/images}   # S6:数据盘目录(仅 wenyan 渲染临时文件落位;图片不再落本地)
    max-upload-mb: ${IMAGE_MAX_UPLOAD_MB:10}
  car:
    # S6:车型知识库(比亚迪官网公开 JSON API,无鉴权)
    goods-list-url: ${CAR_GOODS_LIST_URL:https://cms-api.byd.com/car/byd/cn/goodsListForSearch}
    goods-info-url: ${CAR_GOODS_INFO_URL:https://cms-api.byd.com/car/byd/cn/getGoodsInfoById}
    goods-params-url: ${CAR_GOODS_PARAMS_URL:https://site-api.byd.com/domestic-official-api/goods/goodsParams}
    goods-attr-list-url: ${CAR_GOODS_ATTR_LIST_URL:https://cms-api.byd.com/car/byd/cn/getGoodsAttrListForCompareByGoodsId}
    timeout-ms: ${CAR_TIMEOUT_MS:30000}
    # goodsParams 接口 HMAC 签名(官网 JS 硬编码,可覆盖)
    hmac-sign-key: ${CAR_HMAC_SIGN_KEY:4a3688a5gcd88g443fga6b7fcb}
    hmac-secret-key: ${CAR_HMAC_SECRET_KEY:fcb8f0ddg5c92g45b7g9d33g04cc55d3be3b}
    sync-enabled: ${CAR_SYNC_ENABLED:false}
    sync-cron: ${CAR_SYNC_CRON:0 0 3 * * ?}
  news:
    # C2:新闻知识域(比亚迪官方 CMS 列表 + www.byd.com 详情页 SSR HTML 抽取)
    list-url: ${NEWS_LIST_URL:https://cms-api.byd.com/es/search}
    detail-base-url: ${NEWS_DETAIL_BASE_URL:https://www.byd.com}
    timeout-ms: ${NEWS_TIMEOUT_MS:30000}
    page-size: ${NEWS_PAGE_SIZE:12}
    sync-enabled: ${NEWS_SYNC_ENABLED:false}
    sync-cron: ${NEWS_SYNC_CRON:0 30 3 * * ?}
  kb:
    # 10-03 E3:知识库生效期对账——每日按当前日期重算 KB 向量 active(生效/到期自动翻转)
    effective-cron: ${KB_EFFECTIVE_CRON:0 5 0 * * ?}
  crawl4ai:
    # 10-05-crawl4ai-transport:抓取通道(Crawl4AI 无头浏览器,过指纹 WAF/渲染 SPA;B 级信源用)
    # 资源红线:并发 ≤2、同 host ≤2/天(来自调研报告:无头浏览器 300-400MB、swap 偏紧,不得放宽)
    base-url: ${CRAWL4AI_BASE_URL:}
    api-key: ${CRAWL4AI_API_KEY:}
    max-concurrency: ${CRAWL4AI_MAX_CONCURRENCY:2}
    per-host-daily-limit: ${CRAWL4AI_PER_HOST_DAILY_LIMIT:2}
    timeout-ms: ${CRAWL4AI_TIMEOUT_MS:20000}
    # HTTP 通道无硬日上限,仅同 host 最小间隔(工信部一次公示含多条子页可一轮采完)
    source-http-min-interval-ms: ${SOURCE_HTTP_MIN_INTERVAL_MS:2000}
  source:
    # 10-05-source-crawl-base:通用信源采集基座(信源注册表 + 多栏目 + 动态调度)
    # 总开关默认关闭=零回归;关闭时不注册任何调度、不发起采集。
    collect-enabled: ${SOURCE_COLLECT_ENABLED:false}
    # 资源红线(父 design §3.3):全局串行、并发 ≤2、同站 ≤2/天。
    max-concurrency: ${SOURCE_MAX_CONCURRENCY:2}
    per-site-daily-max: ${SOURCE_PER_SITE_DAILY_MAX:2}
  qiniu:
    enabled: ${QINIU_ENABLED:true}
    access-key: ${QINIU_ACCESS_KEY:${AK:}}    # 兼容旧裸名 AK/SK
    secret-key: ${QINIU_SECRET_KEY:${SK:}}
    bucket: ${QINIU_BUCKET:caiqz}             # 唯一绑定外链域名的空间
    upload-host: ${QINIU_UPLOAD_HOST:http://up-z2.qiniup.com}   # z2 区域实测
    public-domain: ${QINIU_PUBLIC_DOMAIN:http://pic.caiqz.cn}   # http-only(https 未配证书)
    token-ttl-seconds: ${QINIU_TOKEN_TTL:3600}

logging:
  level:
    com.sparkora: INFO
    org.springframework.security: INFO
