server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sparkora
  datasource:
    url: jdbc:postgresql://${SPARKORA_DB_HOST:localhost}:${SPARKORA_DB_PORT:5432}/${SPARKORA_DB_NAME:sparkora}
    username: ${SPARKORA_DB_USER:sparkora}
    password: ${SPARKORA_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      # S3b:配图上传放开 Spring 默认 1MB 限制(对齐 IMAGE_MAX_UPLOAD_MB,略放宽头开销)
      max-file-size: ${IMAGE_MAX_UPLOAD_MB:10}MB
      max-request-size: 15MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-prefix: sparkora_
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# ===== Sparkora 业务配置 =====
sparkora:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string}
    expire-minutes: ${JWT_EXPIRE_MINUTES:1440}
  ai:
    base-url: ${AI_BASE_URL:https://axo.caiqz.cn}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    embedding-model: ${AI_EMBEDDING_MODEL:}   # S6:向量化模型(车型知识库 RAG,实测 Qwen3-Embedding-8B)
    image-model: ${AI_IMAGE_MODEL:}
    image-models: ${AI_IMAGE_MODELS:}   # 逗号分隔，按序轮询（图片模型不稳定）
    timeout-ms: ${AI_TIMEOUT_MS:120000}
    temperature: ${AI_TEMPERATURE:0.7}
  wechat:
    enabled: ${WECHAT_MP_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  wenyan:
    # S4 方案 A:预览用本机 CLI render(与 server 同核),发布(S5)走远程 server;
    # 发布通道是否可用只看 server-url+server-api-key(旧 WENYAN_MCP_ENABLED 开关已废弃移除)
    server-url: ${WENYAN_MCP_SERVER_URL:}
    server-api-key: ${WENYAN_MCP_SERVER_API_KEY:}
    # S4 方案 A:预览用本机 CLI render(与 server 同核),发布(S5)走远程 server
    cli-path: ${WENYAN_CLI_PATH:wenyan}
    default-theme: ${WENYAN_DEFAULT_THEME:default}
    theme-names: ${WENYAN_THEME_NAMES:default,lapis,orangeheart,phycat}
    highlight: ${WENYAN_HIGHLIGHT:solarized-light}
    mac-style: ${WENYAN_MAC_STYLE:true}
    footnote: ${WENYAN_FOOTNOTE:true}
    render-timeout-ms: ${WENYAN_RENDER_TIMEOUT_MS:30000}
    # S5 发布:远程 server HTTP 调用读超时(错误 key 曾有挂起行为,不宜过长)
    publish-timeout-ms: ${WENYAN_MCP_PUBLISH_TIMEOUT_MS:30000}
  image:
    storage-dir: ${IMAGE_STORAGE_DIR:./data/images}   # S6:数据盘目录(仅 wenyan 渲染临时文件落位;图片不再落本地)
    max-upload-mb: ${IMAGE_MAX_UPLOAD_MB:10}
  car:
    # S6:车型知识库(比亚迪官网公开 JSON API,无鉴权)
    goods-list-url: ${CAR_GOODS_LIST_URL:https://cms-api.byd.com/car/byd/cn/goodsListForSearch}
    goods-info-url: ${CAR_GOODS_INFO_URL:https://cms-api.byd.com/car/byd/cn/getGoodsInfoById}
    goods-params-url: ${CAR_GOODS_PARAMS_URL:https://site-api.byd.com/domestic-official-api/goods/goodsParams}
    goods-attr-list-url: ${CAR_GOODS_ATTR_LIST_URL:https://cms-api.byd.com/car/byd/cn/getGoodsAttrListForCompareByGoodsId}
    timeout-ms: ${CAR_TIMEOUT_MS:30000}
    # goodsParams 接口 HMAC 签名(官网 JS 硬编码,可覆盖)
    hmac-sign-key: ${CAR_HMAC_SIGN_KEY:4a3688a5gcd88g443fga6b7fcb}
    hmac-secret-key: ${CAR_HMAC_SECRET_KEY:fcb8f0ddg5c92g45b7g9d33g04cc55d3be3b}
    sync-enabled: ${CAR_SYNC_ENABLED:false}
    sync-cron: ${CAR_SYNC_CRON:0 0 3 * * ?}
  qiniu:
    enabled: ${QINIU_ENABLED:true}
    access-key: ${QINIU_ACCESS_KEY:${AK:}}    # 兼容旧裸名 AK/SK
    secret-key: ${QINIU_SECRET_KEY:${SK:}}
    bucket: ${QINIU_BUCKET:caiqz}             # 唯一绑定外链域名的空间
    upload-host: ${QINIU_UPLOAD_HOST:http://up-z2.qiniup.com}   # z2 区域实测
    public-domain: ${QINIU_PUBLIC_DOMAIN:http://pic.caiqz.cn}   # http-only(https 未配证书)
    token-ttl-seconds: ${QINIU_TOKEN_TTL:3600}

logging:
  level:
    com.sparkora: INFO
    org.springframework.security: INFO
